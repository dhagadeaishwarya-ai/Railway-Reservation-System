<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Train Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="sidebar">

    <h3>RailBook</h3>

    <a href="/">Dashboard</a>
    <a href="/trains-page">Trains</a>
    <a href="/passengers-page">Passengers</a>
    <a href="/reservations-page">Reservations</a>
    <a href="/search-page">Search Trains</a>
    <a href="/book-page">Book Ticket</a>
    <a href="/pnr-page">PNR Status</a>

    <hr style="color:white;">

    <a href="/logout">Logout</a>

</div>

<div class="content">

    <div class="container-fluid">

        <h2 class="mb-4">
            Train Management
        </h2>

        <form action="/save-train"
              method="post">

            <div class="row">

                <div class="col-md-4">

                    <input
                            type="text"
                            name="trainNumber"
                            class="form-control"
                            placeholder="Train Number">

                </div>

                <div class="col-md-4">

                    <input
                            type="text"
                            name="trainName"
                            class="form-control"
                            placeholder="Train Name">

                </div>

                <div class="col-md-4">

                    <input
                            type="text"
                            name="source"
                            class="form-control"
                            placeholder="Source">

                </div>

            </div>

            <br>

            <div class="row">

                <div class="col-md-4">

                    <input
                            type="text"
                            name="destination"
                            class="form-control"
                            placeholder="Destination">

                </div>

                <div class="col-md-4">

                    <input
                            type="number"
                            name="distanceKm"
                            class="form-control"
                            placeholder="Distance (KM)">

                </div>

                <div class="col-md-2">

                    <input
                            type="number"
                            name="totalSeats"
                            class="form-control"
                            placeholder="Total Seats">

                </div>

                <div class="col-md-2">

                    <input
                            type="number"
                            name="availableSeats"
                            class="form-control"
                            placeholder="Available">

                </div>

            </div>

            <br>

            <button
                    class="btn btn-primary">

                Save Train

            </button>

        </form>

        <hr>

        <h4>
            All Trains
        </h4>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Train No</th>
                <th>Name</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Action</th>
            </tr>
            </thead>


            <tbody>

            <tr th:each="train : ${trains}">

                <td th:text="${train.id}"></td>

                <td th:text="${train.trainNumber}"></td>

                <td th:text="${train.trainName}"></td>

                <td th:text="${train.source}"></td>

                <td th:text="${train.destination}"></td>

                <td>

                    <a th:href="@{'/delete-train/' + ${train.id}}"
                       class="btn btn-danger btn-sm">

                        Delete

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
