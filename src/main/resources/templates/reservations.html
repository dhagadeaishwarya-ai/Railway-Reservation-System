<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


    <title>Reservation Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">


</head>

<body>

<div class="sidebar">


    <h3>RailBook</h3>

    <a href="/">Dashboard</a>
    <a href="/trains-page">Trains</a>
    <a href="/passengers-page">Passengers</a>
    <a href="/reservations-page">Reservations</a>
    <a href="/search-page">Search Trains</a>
    <a href="/book-page">Book Ticket</a>
    <a href="/pnr-page">PNR Status</a>

    <hr style="color:white;">

    <a href="/logout">Logout</a>

</div>

<div class="content">


    <div class="container-fluid">

        <h2 class="mb-4">
            Reservation Management
        </h2>

        <div
                th:if="${error}"
                class="alert alert-danger"
                th:text="${error}">
        </div>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

            <tr>

                <th>PNR</th>
                <th>Passenger</th>
                <th>Train</th>
                <th>Class</th>
                <th>Seat</th>
                <th>Fare</th>
                <th>Status</th>
                <th>Action</th>
                <th>Journey Date</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="reservation : ${reservations}">

                <td th:text="${reservation.pnr}"></td>

                <td th:text="${reservation.passenger.name}"></td>

                <td th:text="${reservation.train.trainName}"></td>

                <td th:text="${reservation.trainClass}"></td>

                <td th:text="${reservation.seatNumber}"></td>

                <td th:text="${reservation.journeyDate}">
                </td>

                <td>
                    ₹<span th:text="${reservation.ticketPrice}"></span>
                </td>


                <td>

                <span
                        th:if="${reservation.status == 'CONFIRMED'}"
                        class="badge bg-success">

                    CONFIRMED

                </span>

                    <span
                            th:if="${reservation.status != 'CONFIRMED'}"
                            class="badge bg-danger"
                            th:text="${reservation.status}">

                </span>

                </td>

                <td>

                    <a th:href="@{'/cancel-reservation/' + ${reservation.id}}"
                       class="btn btn-danger btn-sm">

                        Cancel Ticket

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


</div>

</body>

</html>
