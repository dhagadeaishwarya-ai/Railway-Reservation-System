<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


    <title>Search Trains</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">



</head>

<body>

<div class="sidebar">



    <h3>RailBook</h3>

    <a href="/">Dashboard</a>
    <a href="/trains-page">Trains</a>
    <a href="/passengers-page">Passengers</a>
    <a href="/reservations-page">Reservations</a>
    <a href="/search-page">Search Trains</a>
    <a href="/book-page">Book Ticket</a>
    <a href="/pnr-page">PNR Status</a>

    <hr style="color:white;">

    <a href="/logout">Logout</a>

</div>

<div class="content">



    <div class="container-fluid">

        <h2 class="mb-4">
            Search Trains
        </h2>

        <form action="/search-trains"
              method="get">

            <div class="row">

                <div class="col-md-4">

                    <input
                            type="text"
                            name="source"
                            class="form-control"
                            placeholder="Source Station">

                </div>

                <div class="col-md-4">

                    <input
                            type="text"
                            name="destination"
                            class="form-control"
                            placeholder="Destination Station">

                </div>

                <div class="col-md-4">

                    <button
                            class="btn btn-primary w-100">

                        Search Trains

                    </button>

                </div>

            </div>

        </form>

        <hr>

        <div th:if="${error}"
             class="alert alert-danger">

            <span th:text="${error}">
            </span>

        </div>

        <h4>
            Available Trains
        </h4>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

            <tr>

                <th>Train No</th>
                <th>Train Name</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Distance (KM)</th>
                <th>Available Seats</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="train : ${trains}">

                <td th:text="${train.trainNumber}"></td>

                <td th:text="${train.trainName}"></td>

                <td th:text="${train.source}"></td>

                <td th:text="${train.destination}"></td>

                <td th:text="${train.distanceKm}"></td>

                <td th:text="${train.availableSeats}"></td>

                <td>

                    <a href="/book-page"
                       class="btn btn-success btn-sm">

                        Book

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


</div>

</body>

</html>
