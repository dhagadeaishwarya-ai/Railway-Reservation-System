<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Passenger Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="sidebar">

    <h3>RailBook</h3>

    <a href="/">Dashboard</a>
    <a href="/trains-page">Trains</a>
    <a href="/passengers-page">Passengers</a>
    <a href="/reservations-page">Reservations</a>
    <a href="/search-page">Search Trains</a>
    <a href="/book-page">Book Ticket</a>
    <a href="/pnr-page">PNR Status</a>

    <hr style="color:white;">

    <a href="/logout">Logout</a>

</div>

<div class="content">

    <div class="container-fluid">

        <h2 class="mb-4">
            Passenger Management
        </h2>

        <form action="/save-passenger"
              method="post">

            <div class="row">

                <div class="col-md-3">

                    <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Passenger Name">

                </div>

                <div class="col-md-2">

                    <input
                            type="number"
                            name="age"
                            class="form-control"
                            placeholder="Age">

                </div>

                <div class="col-md-2">

                    <input
                            type="text"
                            name="gender"
                            class="form-control"
                            placeholder="Gender">

                </div>

                <div class="col-md-3">

                    <input
                            type="text"
                            name="mobile"
                            class="form-control"
                            placeholder="Mobile Number">

                </div>

                <div class="col-md-2">

                    <button
                            class="btn btn-primary w-100">

                        Save Passenger

                    </button>

                </div>

            </div>

        </form>

        <hr>

        <h4>
            All Passengers
        </h4>

        <table
                class="table table-bordered table-striped">

            <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Mobile</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="passenger : ${passengers}">

                <td th:text="${passenger.id}"></td>

                <td th:text="${passenger.name}"></td>

                <td th:text="${passenger.age}"></td>

                <td th:text="${passenger.gender}"></td>

                <td th:text="${passenger.mobile}"></td>

                <td>

                    <a th:href="@{'/delete-passenger/' + ${passenger.id}}"
                       class="btn btn-danger btn-sm">

                        Delete

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
