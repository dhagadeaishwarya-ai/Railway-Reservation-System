<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


    <title>PNR Status</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">


</head>

<body>

<div class="sidebar">


    <h3>RailBook</h3>

    <a href="/">Dashboard</a>
    <a href="/trains-page">Trains</a>
    <a href="/passengers-page">Passengers</a>
    <a href="/reservations-page">Reservations</a>
    <a href="/search-page">Search Trains</a>
    <a href="/book-page">Book Ticket</a>
    <a href="/pnr-page">PNR Status</a>

    <hr style="color:white;">

    <a href="/logout">Logout</a>
    
</div>

<div class="content">


    <div class="container-fluid">

        <h2 class="mb-4">
            PNR Status
        </h2>

        <div class="card p-4">

            <form action="/search-pnr"
                  method="get">

                <div class="row">

                    <div class="col-md-8">

                        <input
                                type="text"
                                name="pnr"
                                class="form-control"
                                placeholder="Enter PNR Number">

                    </div>

                    <div class="col-md-4">

                        <button
                                class="btn btn-primary w-100">

                            Search PNR

                        </button>

                    </div>

                </div>

            </form>

            <div th:if="${error}"
                 class="alert alert-danger mt-3">

                <span th:text="${error}"></span>

            </div>

        </div>

        <br>

        <div th:if="${reservation != null}">

            <table class="table table-bordered">

                <tr>
                    <th>PNR Number</th>
                    <td th:text="${reservation.pnr}"></td>
                </tr>

                <tr>
                    <th>Passenger Name</th>
                    <td th:text="${reservation.passenger.name}"></td>
                </tr>

                <tr>
                    <th>Train Name</th>
                    <td th:text="${reservation.train.trainName}"></td>
                </tr>

                <tr>
                    <th>Travel Class</th>
                    <td th:text="${reservation.trainClass}"></td>
                </tr>

                <tr>
                    <th>Journey Date</th>

                    <td th:text="${reservation.journeyDate}">
                    </td>
                </tr>

                <tr>
                    <th>Seat Number</th>
                    <td th:text="${reservation.seatNumber}"></td>
                </tr>

                <tr>
                    <th>Fare</th>
                    <td>
                        ₹
                        <span th:text="${reservation.ticketPrice}">
                    </span>
                    </td>
                </tr>

                <tr>
                    <th>Status</th>
                    <td>

                    <span
                            th:if="${reservation.status == 'CONFIRMED'}"
                            class="badge bg-success">

                        CONFIRMED

                    </span>

                        <span
                                th:if="${reservation.status != 'CONFIRMED'}"
                                class="badge bg-danger"
                                th:text="${reservation.status}">
                    </span>

                    </td>
                </tr>

            </table>

        </div>

    </div>


</div>

</body>

</html>
