<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


    <title>Book Ticket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">


</head>

<body>

<div class="sidebar">


    <h3>RailBook</h3>

    <a href="/">Dashboard</a>
    <a href="/trains-page">Trains</a>
    <a href="/passengers-page">Passengers</a>
    <a href="/reservations-page">Reservations</a>
    <a href="/search-page">Search Trains</a>
    <a href="/book-page">Book Ticket</a>
    <a href="/pnr-page">PNR Status</a>

    <hr style="color:white;">

    <a href="/logout">Logout</a>

</div>

<div class="content">


    <div class="container-fluid">

        <h2 class="mb-4">
            Book Ticket
        </h2>

        <div
                th:if="${error}"
                class="alert alert-danger"
                th:text="${error}">
        </div>

        <div class="card p-4">

            <form action="/book-ticket-ui"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Passenger
                    </label>

                    <select name="passengerId"
                            class="form-select">

                        <option
                                th:each="p : ${passengers}"
                                th:value="${p.id}"
                                th:text="${p.name}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Train
                    </label>

                    <select name="trainId"
                            class="form-select">

                        <option
                                th:each="t : ${trains}"
                                th:value="${t.id}"
                                th:text="${t.trainName}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Travel Class
                    </label>

                    <select name="trainClass"
                            class="form-select">

                        <option>GENERAL</option>
                        <option>SLEEPER</option>
                        <option>AC_3</option>
                        <option>AC_2</option>
                        <option>BUSINESS</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Journey Date

                    </label>

                    <input
                            type="date"
                            name="journeyDate"
                            class="form-control">

                </div>

                <button
                        class="btn btn-primary">

                    Book Ticket

                </button>

            </form>

        </div>

    </div>


</div>

</body>

</html>
