<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card p-4">

                <h3 class="text-center">
                    Railway Login
                </h3>

                <form action="/login"
                      method="post">

                    <div class="mb-3">

                        <label>Username</label>

                        <input
                                type="text"
                                name="username"
                                class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input
                                type="password"
                                name="password"
                                class="form-control">

                    </div>

                    <button
                            class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <div th:if="${error}"
                     class="alert alert-danger mt-3">

                    <span th:text="${error}">
                    </span>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
